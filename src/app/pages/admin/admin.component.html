<div class="admin-container">
  <header class="header-section">
    <h2>Panel de Super Admin</h2>
    <button class="btn-back" (click)="goBack()">
      <i class="fas fa-arrow-left"></i> Volver al Dashboard
    </button>
  </header>

  <div class="admin-layout">
    <!-- Gestión de Usuarios -->
    <section class="card">
      <div class="section-title">
        <i class="fas fa-users-cog fa-2x text-purple-500"></i>
        <h3>Gestión de Usuarios y Roles (RBAC)</h3>
      </div>

      <table class="premium-table">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Teléfono</th>
            <th>Roles Actuales</th>
            <th>Gestionar Roles</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>
              <div class="user-info">
                <span class="user-name">{{ user.nombre }} {{ user.apellido }}</span>
                <span class="user-email">{{ user.email }}</span>
              </div>
            </td>
            <td><span class="text-slate-400">{{ user.telefono }}</span></td>
            <td>
              <div class="role-badges">
                <div *ngFor="let role of user.roles" class="badge" [ngClass]="role === 'ADMIN' ? 'badge-admin' : 'badge-user'">
                  {{ role }}
                  <button *ngIf="user.roles.length > 1" class="btn-remove-role" (click)="removeRole(user.id, role)">
                    <i class="fas fa-times-circle"></i>
                  </button>
                </div>
              </div>
            </td>
            <td>
              <div class="role-actions">
                <select #roleSelect>
                  <option value="USER">USER</option>
                  <option value="ADMIN">ADMIN</option>
                </select>
                <button class="btn-add-role" (click)="addRole(user.id, roleSelect.value)">
                  Asignar
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Gestión de Roles (Opcional/Futuro) -->
    <section class="card" *ngIf="false">
      <div class="section-title">
        <i class="fas fa-shield-alt fa-2x text-blue-500"></i>
        <h3>Definición de Roles del Sistema</h3>
      </div>
      <!-- Aquí podrías añadir un mini-crud de roles -->
    </section>
  </div>
</div>
